<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Inputs</title>
</head>
<body>
    <div class="wrapper">
        <form action="#" method="get" class="form-block">
            <div class="form-block__title">
                Кастомные инпуты
            </div>
            <div class="form-block__inputs">
                <div class="checkboxes">
                    <input class="--hidden" type="checkbox" name="checkbox" value="1" id="1" checked>
                    <label class="checkbox" for="1">Вариант №1</label>
                    
                    <input class="--hidden" type="checkbox" name="checkbox" value="2" id="2">
                    <label class="checkbox" for="2">Вариант №2</label>
                    
                    <input class="--hidden" type="checkbox" name="checkbox" value="3" id="3">
                    <label class="checkbox" for="3">Вариант №3</label>
                </div>
                <div class="radio-buttons">
                    <input class="--hidden" type="radio" name="radio" value="o1" id="4" checked>
                    <label class="radio-button" for="4">Опция №1</label>
                    
                    <input class="--hidden" type="radio" name="radio" value="o2" id="5">
                    <label class="radio-button" for="5">Опция №2</label>
                    
                    <input class="--hidden" type="radio" name="radio" value="o3" id="6">
                    <label class="radio-button" for="6">Опция №3</label>
                </div>
            </div>
            <button type="submit">Отправить</button>
        </form>
    </div>
</body>
</html>
